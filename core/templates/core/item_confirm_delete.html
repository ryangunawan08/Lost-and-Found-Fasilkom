<!DOCTYPE html>
<html>
<head>
    <title>Hapus Laporan</title>
</head>
<body>
    <h1>Konfirmasi Hapus</h1>
    <p>Yakin ingin menghapus laporan <strong>{{ item.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Ya, Hapus</button>
        <a href="{% url 'item_detail' item.pk %}">Batal</a>
    </form>
</body>
</html>
